# Monthly country packs: build each block (a country, or neighbours routed across as one graph), one at a time; upload it
# under an immutable version path within the bucket budget, then switch the manifest to it.
name: Build packs

on:
  schedule:
    - cron: "0 3 2 * *"  # the 2nd: Geofabrik's extracts of the 1st are out
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country ids; a block member builds its whole block (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      blocks: ${{ steps.pick.outputs.blocks }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: pick
        env:
          WANTED: ${{ inputs.countries }}
        run: |
          # an unknown id fails here, not as an empty build
          blocks=$(uv run --no-project --with pyyaml python -c 'import json, os; from mapspack.config import plan; print(json.dumps(plan([w.strip() for w in os.environ.get("WANTED", "").split(",") if w.strip()])))')
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # one block at a time: each switches the manifest and checks the bucket budget after the one before
      max-parallel: 1
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af > /dev/null
          df -h /
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq libicu-dev pkg-config
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Build the block's packs
        run: scripts/build_block.sh ${{ matrix.block }} work
      - name: Publish the block
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p entries && cp work/*.entry.json entries/
          ids=$(for e in entries/*.entry.json; do basename "$e" .entry.json; done)
          scripts/publish.sh get-manifest current.json
          # R2's free tier is 10 GB: make room from retired versions first, or publish nothing
          scripts/publish.sh usage > usage.json
          uv run python -m mapspack budget current.json usage.json $(for id in $ids; do echo "work/$id"; done) > free.txt
          while read -r prefix; do echo "delete $prefix (over budget)"; scripts/publish.sh delete "$prefix"; done < free.txt
          for id in $ids; do
            prefix=$(python3 -c "import json; e=json.load(open('entries/$id.entry.json')); print(f\"packs/{e['id']}/{e['version']}/\")")
            scripts/publish.sh pack "work/$id" "$prefix"
          done
          # the manifest switches last, per block: a client never sees a half-published pack
          uv run python -m mapspack merge current.json entries > manifest.json
          scripts/publish.sh put-manifest manifest.json
          python3 -c "import json; m=json.load(open('manifest.json')); print(sum(f['size'] for p in m['packs'] for f in p['files'])/1e9, 'GB in current packs'); [print(p['id'], p['version']) for p in m['packs']]"
          scripts/publish.sh usage | python3 -c "import json, sys; print(json.load(sys.stdin)['*'] / 1e9, 'GB in the bucket')"
          df -h /; du -sh work/*/

  sweep:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq libicu-dev pkg-config && uv sync
      - name: Delete retired versions
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          scripts/publish.sh get-manifest manifest.json
          [ -f manifest.json ] || { echo "no manifest"; exit 0; }
          scripts/publish.sh list > listing.json
          uv run python -m mapspack retired manifest.json listing.json | while read -r prefix; do
            echo "delete $prefix"; scripts/publish.sh delete "$prefix"
          done
          scripts/publish.sh usage | python3 -c "import json, sys; print(json.load(sys.stdin)['*'] / 1e9, 'GB in the bucket')"
